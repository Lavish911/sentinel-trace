    <script>
      (function () {
        function isInjectedExtensionError(msg, src, stack) {
          var combined = String(msg || '') + ' ' + String(src || '') + ' ' + String(stack || '');
          return (
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('Failed to connect to MetaMask') !== -1 ||
            combined.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            combined.indexOf('inpage.js') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            var errStack = event && event.error && event.error.stack ? event.error.stack : '';
            if (isInjectedExtensionError(event && event.message, event && event.filename, errStack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && reason.stack ? reason.stack : '';
            if (isInjectedExtensionError(msg, '', stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
